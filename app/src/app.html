<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        %sveltekit.head%

        <title>UChat - Custom Twitch Chat Overlay by uniiDev</title>

        <meta name="robots" content="index, follow" />
        <meta name="author" content="uniiDev" />

        <meta
            name="description"
            content="UChat is a multiplaform chat overlay for Twitch, Kick & YouTube with custom settings, saved preferences, and support for 7TV, BTTV, and FFZ. Copy your overlay URL, reset settings, and preview chat instantly. Works with OBS, Streamlabs, and XSplit."
        />

        <meta
            name="keywords"
            content="UChat, Twitch chat overlay, Kick chat overlay, YouTube chat overlay, multiplatform chat overlay, UChat overlay, Twitch chat overlay tool, Kick chat overlay tool, YouTube chat overlay tool, multiplatform chat overlay tool, overlay URL, chat settings, saved preferences, reset settings, invalid URL, channel name, Twitch emotes, 7TV, BetterTTV, BTTV, FrankerFaceZ, FFZ, OBS overlay, Streamlabs overlay, XSplit overlay, live stream chat, Twitch overlay customization, Twitch chat viewer, Twitch chat integration, chat moderation tools, Twitch stream tools, Kick stream tools, YouTube stream tools"
        />

        <meta
            property="og:title"
            content="UChat Twitch, Kick & YouTube Multiplaform Chat Overlay Setup • uniiDev"
        />
        <meta
            name="twitter:title"
            content="UChat Twitch, Kick & YouTube Multiplaform Chat Overlay Setup • uniiDev"
        />
        <meta
            property="og:description"
            content="UChat is a multiplaform chat overlay for Twitch, Kick & YouTube with custom settings, saved preferences, and support for 7TV, BTTV, and FFZ. Copy your overlay URL, reset settings, and preview chat instantly. Works with OBS, Streamlabs, and XSplit."
        />
        <meta
            name="twitter:description"
            content="UChat is a multiplaform chat overlay for Twitch, Kick & YouTube with custom settings, saved preferences, and support for 7TV, BTTV, and FFZ. Copy your overlay URL, reset settings, and preview chat instantly. Works with OBS, Streamlabs, and XSplit."
        />

        <meta property="og:site_name" content="UChat" />
        <meta property="og:url" content="https://chat.unii.dev" />
        <meta property="og:type" content="website" />

        <meta
            property="og:image"
            content="https://chat.unii.dev/images/banner.png"
        />
        <meta property="og:image:alt" content="UChat chat overlay preview" />

        <meta
            name="twitter:image"
            content="https://chat.unii.dev/images/banner.png"
        />
        <meta name="twitter:image:alt" content="UChat chat overlay preview" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="theme-color" content="#7C5CFC" />
        <meta name="twitter:site" content="@KillerFiszh" />
        <meta name="twitter:creator" content="@KillerFiszh" />

        <link rel="canonical" href="https://chat.unii.dev" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin="anonymous"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
        />

        <script type="application/json" id="discord:component-embed">
            {
                "component": {
                    "type": 17,
                    "accent_color": 8142076,
                    "components": [
                        {
                            "type": 10,
                            "content": "# UChat\nCustomizable Multiplaform chat overlay for Twitch, Kick & YouTube with support for 7TV, BTTV, and FFZ."
                        },
                        {
                            "type": 12,
                            "items": [
                                {
                                    "media": {
                                        "url": "https://chat.unii.dev/images/banner.png"
                                    }
                                }
                            ]
                        },
                        { "type": 14 },
                        {
                            "type": 1,
                            "components": [
                                {
                                    "type": 2,
                                    "style": 5,
                                    "label": "Open UChat",
                                    "url": "https://chat.unii.dev"
                                },
                                {
                                    "type": 2,
                                    "style": 5,
                                    "label": "Message Creator",
                                    "url": "https://chat.unii.dev/message-creator"
                                },
                                {
                                    "type": 2,
                                    "style": 5,
                                    "label": "GitHub",
                                    "url": "https://github.com/Fiszh/UChat"
                                }
                            ]
                        },
                        {
                            "type": 10,
                            "content": "-# unii.dev · Open source"
                        }
                    ]
                }
            }
        </script>

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "SoftwareApplication",
                "name": "UChat",
                "url": "https://chat.unii.dev",
                "applicationCategory": "WebApplication",
                "applicationSubCategory": "Streaming software",
                "operatingSystem": "Any",
                "author": {
                    "@type": "Person",
                    "name": "uniiDev",
                    "url": "https://twitch.tv/uniiDev"
                },
                "sameAs": [
                    "https://github.com/Fiszh/UChat",
                    "https://twitch.tv/uniiDev",
                    "https://discord.com/users/703639905691238490"
                ]
            }
        </script>
    </head>

    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
